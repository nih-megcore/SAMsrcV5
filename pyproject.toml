[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "samsrcv5"
version = "5.0.0"
description = "Synthetic Aperture Magnetometry Suite Version 5"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
  { name = "NIH MEG Core Facility" },
]
keywords = ["MEG", "magnetoencephalography", "beamforming", "SAM"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "matplotlib>=3.7",
  "nibabel>=5",
  "numpy>=1.26",
  "pillow<12; python_version < '3.11'",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://megcore.nih.gov/index.php?title=Source_Localization_-_SAM"
Repository = "https://github.com/nih-megcore/SAMsrcV5"

[project.scripts]
"1dstats" = "samsrcv5.launcher:stats_1d"
"3dNormalize" = "samsrcv5.normalize:main"
"FSnormals.py" = "samsrcv5.launcher:fsnormals"
"FSnormals" = "samsrcv5.launcher:fsnormals"
"fiddist.py" = "samsrcv5.launcher:fiddist"
"fiddist" = "samsrcv5.launcher:fiddist"
"meshnorm" = "samsrcv5.launcher:meshnorm"
"mkGiiAtlas.py" = "samsrcv5.launcher:mk_gii_atlas"
"mkGiiAtlas" = "samsrcv5.launcher:mk_gii_atlas"
"OPMsim" = "samsrcv5.launcher:opm_sim"
"orthohull" = "samsrcv5.launcher:orthohull"
"orthohull.py" = "samsrcv5.launcher:orthohull_python"
"plothull.py" = "samsrcv5.launcher:plothull"
"plothull" = "samsrcv5.launcher:plothull"
"ply2fid" = "samsrcv5.launcher:ply2fid"
"ROIbuilder" = "samsrcv5.launcher:roi_builder"
"sam_3d" = "samsrcv5.launcher:sam_3d"
"sam_4d" = "samsrcv5.launcher:sam_4d"
"sam_cov" = "samsrcv5.launcher:sam_cov"
"sam_ers" = "samsrcv5.launcher:sam_ers"
"sam_param_gui" = "samsrcv5.param_gui:main"
"sam_power" = "samsrcv5.launcher:sam_power"
"sam_simulate" = "samsrcv5.launcher:sam_simulate"
"sam_wts" = "samsrcv5.launcher:sam_wts"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["src/samsrcv5"]
wheel.py-api = "py3"
sdist.include = [
  "CMakeLists.txt",
  "cmake/**",
  "docs/**",
  "include/**",
  "Libs/**",
  "Mains/**",
  "src/**",
  "tools/**",
  "THIRD_PARTY_NOTICES.md",
  "LICENSE.package",
]

[tool.scikit-build.cmake.define]
SAM_BUILD_TESTING = "OFF"

[tool.pytest.ini_options]
markers = [
  "unit: fast tests that do not require external scientific data",
  "integration: CTF and AFNI end-to-end tests",
  "slow: opt-in full-volume AFNI and CTF beamformer tests",
]
testpaths = ["test"]

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_*"
build-verbosity = 1
test-requires = ["pytest>=8"]
test-command = "python -m pytest {project}/test/wheel -q --import-mode=importlib"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
before-build = "python -m pip install delvewheel==1.13.0"
repair-wheel-command = "python -m delvewheel repair --analyze-existing-exes -w {dest_dir} -v {wheel}"
